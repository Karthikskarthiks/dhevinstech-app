{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works Updates</title>
    <link rel="icon" href="{% url 'favicon' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">



    <style>
        body {
            background: linear-gradient(90deg, #000000, #0a0a0a, #1a1a1a, #0a0a0a);
            background-size: 300% 100%;
            min-height: 100vh;
            animation: bodyGradient 8s ease infinite;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 10% 20%, rgba(0, 212, 255, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 80%, rgba(139, 92, 246, 0.45) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 30%, rgba(236, 72, 153, 0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 70%, rgba(6, 182, 212, 0.45) 0%, transparent 45%),
                radial-gradient(ellipse at 90% 40%, rgba(139, 92, 246, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 25% 50%, rgba(0, 212, 255, 0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 75% 60%, rgba(236, 72, 153, 0.45) 0%, transparent 45%);
            pointer-events: none;
            z-index: -1;
            animation: glowPulse 4s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 80% 10%, rgba(6, 182, 212, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 90%, rgba(0, 212, 255, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 40% 20%, rgba(236, 72, 153, 0.25) 0%, transparent 35%);
            pointer-events: none;
            z-index: -1;
            animation: glowPulse2 5s ease-in-out infinite alternate;
        }

        @keyframes bodyGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes glowPulse2 {
            0% {
                opacity: 0.5;
                transform: translateX(-10px);
            }

            100% {
                opacity: 0.8;
                transform: translateX(10px);
            }
        }

        .table tbody tr:hover {
            background-color: #f1f3f5;
            transition: 0.3s ease;
            width: 100px;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .btn {
            border-radius: 20px;
        }

        .badge {
            font-size: 0.85rem;
            padding: 6px 10px;
        }
    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <!-- --------Dynamic content------- -->
    {% block content %}


    {% endblock %}

    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
